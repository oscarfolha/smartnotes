name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile for current npm
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          node -e "console.log('lockfileVersion:', JSON.parse(require('fs').readFileSync('package-lock.json','utf8')).lockfileVersion)"

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build app
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile for current npm
        working-directory: backend
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
          node -e "console.log('lockfileVersion:', JSON.parse(require('fs').readFileSync('package-lock.json','utf8')).lockfileVersion)"

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Build app
        working-directory: backend
        run: npm run build
