name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Pin npm 10.x
        run: npm install -g npm@10.8.2

      - name: Show pinned npm version
        run: npm --version

      - name: Reset npm cache
        run: npm cache clean --force

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build app
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Pin npm 10.x
        run: npm install -g npm@10.8.2

      - name: Show pinned npm version
        run: npm --version

      - name: Reset npm cache
        run: npm cache clean --force

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        working-directory: backend
        run: npm test

      - name: Build app
        working-directory: backend
        run: npm run build
